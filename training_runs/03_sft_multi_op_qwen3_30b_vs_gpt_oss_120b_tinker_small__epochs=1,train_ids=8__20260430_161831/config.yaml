experiment_name: 03_sft_multi_op_qwen3_30b_vs_gpt_oss_120b_tinker_small
description: Multi-OP SFT on the small ShareGPT split vs gpt-oss-120b-thinking. Trains
  jointly on UT_PW, UT_IND, AT_PW, AT_IND with per_id_one_source so each source-article
  UUID contributes one randomly-selected OP framing per epoch. Mirrors configs 01
  (llama) and 02 (gpt-oss-20b); uses ARCH-style training data uploaded by Callum at
  data/data/training_data/.
algorithm: sft
wandb_project: sgtr-rl
data:
  generator_models:
  - gpt-oss-120b-thinking
  dataset: sharegpt
  train_files:
  - data/data/training_data/qwen3-30b_ARCH_01_UT_PW-Q_Rec_NPr_FA_Inst_vs_gpt-oss-120b-thinking_sharegpt_archived_small/train.jsonl
  - data/data/training_data/qwen3-30b_ARCH_02_UT_IND-Q_Rec_NPr_FA_Inst_vs_gpt-oss-120b-thinking_sharegpt_archived_small/train.jsonl
  - data/data/training_data/qwen3-30b_ARCH_03_AT_PW-C_Rec_NPr_FA_Inst_vs_gpt-oss-120b-thinking_sharegpt_archived_small/train.jsonl
  - data/data/training_data/qwen3-30b_ARCH_04_AT_IND-C_Rec_NPr_FA_Inst_vs_gpt-oss-120b-thinking_sharegpt_archived_small/train.jsonl
  val_files:
  - data/data/training_data/qwen3-30b_ARCH_01_UT_PW-Q_Rec_NPr_FA_Inst_vs_gpt-oss-120b-thinking_sharegpt_archived_small/val.jsonl
  - data/data/training_data/qwen3-30b_ARCH_02_UT_IND-Q_Rec_NPr_FA_Inst_vs_gpt-oss-120b-thinking_sharegpt_archived_small/val.jsonl
  - data/data/training_data/qwen3-30b_ARCH_03_AT_PW-C_Rec_NPr_FA_Inst_vs_gpt-oss-120b-thinking_sharegpt_archived_small/val.jsonl
  - data/data/training_data/qwen3-30b_ARCH_04_AT_IND-C_Rec_NPr_FA_Inst_vs_gpt-oss-120b-thinking_sharegpt_archived_small/val.jsonl
  train_mix_strategy: per_id_one_source
  max_train_ids: 8
  subset_seed: null
  randomize_train_labels: false
  randomize_train_labels_seed: null
model:
  name: Qwen/Qwen3-30B-A3B-Instruct-2507
  lora_rank: 32
hyperparameters:
  learning_rate: 5.0e-05
  num_epochs: 1
  batch_size: 16
  seed: 42
  num_rollouts_per_prompt: 4
  max_completion_length: 1024
  max_steps: null
benchmark_evals:
  mmlu_20:
    type: mmlu
    data_file: data/benchmarks/mmlu.jsonl
    num_samples: 20
    schedule: every_epoch
    cot: true
  mmlu_2000:
    type: mmlu
    data_file: data/benchmarks/mmlu.jsonl
    num_samples: 2000
    schedule: end_only
    cot: true
  xeval_op_ut_pw:
    type: sgtr
    data_file: data/data/training_data/qwen3-30b_ARCH_01_UT_PW-Q_Rec_NPr_FA_Inst_vs_gpt-oss-120b-thinking_sharegpt_archived_small/val.jsonl
    schedule: every_5_epochs
    frequency: 5
    num_samples: 20
  xeval_op_ut_pw_full:
    type: sgtr
    data_file: data/data/training_data/qwen3-30b_ARCH_01_UT_PW-Q_Rec_NPr_FA_Inst_vs_gpt-oss-120b-thinking_sharegpt_archived_small/val.jsonl
    schedule: end_only
  xeval_op_ut_ind:
    type: sgtr
    data_file: data/data/training_data/qwen3-30b_ARCH_02_UT_IND-Q_Rec_NPr_FA_Inst_vs_gpt-oss-120b-thinking_sharegpt_archived_small/val.jsonl
    schedule: every_5_epochs
    frequency: 5
    num_samples: 20
  xeval_op_ut_ind_full:
    type: sgtr
    data_file: data/data/training_data/qwen3-30b_ARCH_02_UT_IND-Q_Rec_NPr_FA_Inst_vs_gpt-oss-120b-thinking_sharegpt_archived_small/val.jsonl
    schedule: end_only
  xeval_op_at_pw:
    type: sgtr
    data_file: data/data/training_data/qwen3-30b_ARCH_03_AT_PW-C_Rec_NPr_FA_Inst_vs_gpt-oss-120b-thinking_sharegpt_archived_small/val.jsonl
    schedule: every_5_epochs
    frequency: 5
    num_samples: 20
  xeval_op_at_pw_full:
    type: sgtr
    data_file: data/data/training_data/qwen3-30b_ARCH_03_AT_PW-C_Rec_NPr_FA_Inst_vs_gpt-oss-120b-thinking_sharegpt_archived_small/val.jsonl
    schedule: end_only
  xeval_op_at_ind:
    type: sgtr
    data_file: data/data/training_data/qwen3-30b_ARCH_04_AT_IND-C_Rec_NPr_FA_Inst_vs_gpt-oss-120b-thinking_sharegpt_archived_small/val.jsonl
    schedule: every_5_epochs
    frequency: 5
    num_samples: 20
  xeval_op_at_ind_full:
    type: sgtr
    data_file: data/data/training_data/qwen3-30b_ARCH_04_AT_IND-C_Rec_NPr_FA_Inst_vs_gpt-oss-120b-thinking_sharegpt_archived_small/val.jsonl
    schedule: end_only
  xeval_dataset_wikisum_full:
    type: sgtr
    data_file: data/data/training_data/qwen3-30b_ARCH_01_UT_PW-Q_Rec_NPr_FA_Inst_vs_gpt-oss-120b-thinking_wikisum_archived_small/val.jsonl
    schedule: end_only
  xeval_dataset_bigcodebench_full:
    type: sgtr
    data_file: data/data/training_data/qwen3-30b_ARCH_01_UT_PW-Q_Rec_NPr_FA_Inst_vs_gpt-oss-120b-thinking_bigcodebench_archived_small/val.jsonl
    schedule: end_only
  xeval_dataset_pku_full:
    type: sgtr
    data_file: data/data/training_data/qwen3-30b_ARCH_01_UT_PW-Q_Rec_NPr_FA_Inst_vs_gpt-oss-120b-thinking_pku_saferlhf_archived_small/val.jsonl
    schedule: end_only
evaluation:
  eval_trigger: epoch
  eval_frequency: 1
